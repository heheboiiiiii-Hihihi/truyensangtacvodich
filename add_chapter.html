<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Thêm Chương Mới - Truyện Sáng Tác Vô Địch</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 p-4 md:p-8">
    <script>
        const currentUser = localStorage.getItem('currentUser');
        if (!currentUser) {
            alert('Bạn cần đăng nhập!');
            window.location.href = 'login.html';
        }
    </script>

    <div class="max-w-2xl mx-auto bg-white p-6 rounded shadow">
        <div class="flex justify-between items-center mb-6 border-b pb-4">
            <div>
                <h1 class="text-2xl font-bold text-green-600">✍️ Viết Thêm Chương Mới</h1>
                <p class="text-xs text-gray-500">Chọn truyện và viết nội dung chương tiếp theo</p>
            </div>
            <div>
                <a href="profile.html" class="text-sm text-indigo-600 hover:underline">← Quay lại hồ sơ</a>
            </div>
        </div>

        <form id="chapterForm" class="space-y-4">
            <div>
                <label class="block font-semibold mb-1">Chọn truyện muốn viết chương</label>
                <select id="story-select" class="w-full border p-2 rounded bg-white font-medium" required>
                    <!-- Danh sách truyện của bạn sẽ load vào đây -->
                </select>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block font-semibold mb-1">Chương số</label>
                    <input type="number" id="chapter_num" min="1" value="1" class="w-full border p-2 rounded" required>
                </div>
                <div>
                    <label class="block font-semibold mb-1">Tên chương</label>
                    <input type="text" id="chapter_title" class="w-full border p-2 rounded" placeholder="Ví dụ: Khởi đầu nghịch thiên" required>
                </div>
            </div>

            <div>
                <label class="block font-semibold mb-1">Nội dung chương</label>
                <textarea id="content" class="w-full border p-2 rounded h-64" placeholder="Nhập nội dung chi tiết chương truyện vào đây..." required></textarea>
            </div>

            <button type="submit" class="w-full bg-green-600 text-white font-bold py-3 px-4 rounded hover:bg-green-700 transition">Đăng Chương Này</button>
        </form>
    </div>

    <script>
        // Load danh sách truyện của chính tác giả vào thẻ Select
        const stories = JSON.parse(localStorage.getItem('myStories')) || [];
        const myStories = stories.filter(s => s.uploader === currentUser || (!s.uploader && currentUser === 'admin'));
        
        const selectBox = document.getElementById('story-select');

        if (myStories.length === 0) {
            alert('Bạn chưa tạo bộ truyện nào! Hãy tạo bộ truyện trước.');
            window.location.href = 'admin.html';
        } else {
            selectBox.innerHTML = myStories.map(s => `
                <option value="${s.id}">${s.title} (Tổng số chương hiện tại: ${s.chapters ? s.chapters.length : 0})</option>
            `).join('');
            
            // Tự động gợi ý chương tiếp theo khi chọn truyện
            selectBox.addEventListener('change', updateChapterNumber);
            updateChapterNumber();
        }

        function updateChapterNumber() {
            const selectedId = selectBox.value;
            const targetStory = stories.find(s => s.id === selectedId);
            if (targetStory && targetStory.chapters) {
                // Tự động điền số chương tiếp theo bằng tổng số chương + 1
                document.getElementById('chapter_num').value = targetStory.chapters.length + 1;
            }
        }

        // Xử lý lưu chương mới vào truyện đã chọn
        document.getElementById('chapterForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const selectedId = selectBox.value;
            const chapNum = document.getElementById('chapter_num').value;
            const chapTitle = document.getElementById('chapter_title').value;
            const chapContent = document.getElementById('content').value;

            // Tìm và cập nhật chương vào đúng truyện đó
            const storyIndex = stories.findIndex(s => s.id === selectedId);
            if (storyIndex !== -1) {
                if (!stories[storyIndex].chapters) {
                    stories[storyIndex].chapters = [];
                }

                stories[storyIndex].chapters.push({
                    chapter_number: chapNum,
                    title: chapTitle,
                    content: chapContent
                });

                localStorage.setItem('myStories', JSON.stringify(stories));
                alert('Đăng chương mới thành công!');
                window.location.href = 'profile.html';
            }
        });
    </script>
</body>
</html>
