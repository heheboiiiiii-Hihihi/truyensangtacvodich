<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản Lý Đăng Truyện</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 p-4 md:p-8">
    <div class="max-w-2xl mx-auto bg-white p-6 rounded shadow">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-indigo-600">✍️ Đăng Truyện Mới</h1>
            <a href="index.html" class="text-sm text-indigo-600 hover:underline">← Về trang chủ</a>
        </div>

        <form id="storyForm" class="space-y-4">
            <div>
                <label class="block font-semibold mb-1">Tên truyện</label>
                <input type="text" id="title" class="w-full border p-2 rounded focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Ví dụ: Đấu Phá Thương Khung" required>
            </div>
            
            <div>
                <label class="block font-semibold mb-1">Tác giả</label>
                <input type="text" id="author" class="w-full border p-2 rounded" placeholder="Tên tác giả" required>
            </div>
            
            <div>
                <label class="block font-semibold mb-1">Mô tả ngắn</label>
                <textarea id="description" class="w-full border p-2 rounded h-20" placeholder="Nội dung giới thiệu truyện..." required></textarea>
            </div>

            <div>
                <label class="block font-semibold mb-1">Nội dung (Chương 1)</label>
                <textarea id="content" class="w-full border p-2 rounded h-48" placeholder="Nhập nội dung truyện vào đây..." required></textarea>
            </div>

            <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-2 px-4 rounded hover:bg-indigo-700 transition">Đăng Truyện</button>
        </form>
    </div>

    <script>
        // Xử lý khi bấm nút Đăng Truyện
        document.getElementById('storyForm').addEventListener('submit', function(e) {
            e.preventDefault(); // Ngăn trang tải lại

            // Lấy dữ liệu bạn vừa nhập
            const newStory = {
                id: Date.now().toString(), // Tạo ID ngẫu nhiên
                title: document.getElementById('title').value,
                author: document.getElementById('author').value,
                description: document.getElementById('description').value,
                content: document.getElementById('content').value
            };

            // Lấy danh sách truyện cũ từ bộ nhớ, nếu chưa có thì tạo mảng trống
            let stories = JSON.parse(localStorage.getItem('myStories')) || [];
            
            // Thêm truyện mới vào danh sách
            stories.push(newStory);

            // Lưu ngược lại vào bộ nhớ trình duyệt
            localStorage.setItem('myStories', JSON.stringify(stories));

            alert('Đã đăng truyện thành công!');
            
            // Chuyển hướng về trang chủ
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
