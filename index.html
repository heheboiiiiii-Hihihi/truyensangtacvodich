<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Truyện Sáng Tác Vô Địch</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800">
    <header class="bg-white shadow p-4 mb-6">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold text-indigo-600">📖 Truyện Sáng Tác Vô Địch</h1>
            <a href="admin.html" class="bg-indigo-600 text-white px-4 py-2 rounded text-sm hover:bg-indigo-700">Quản trị / Đăng truyện</a>
        </div>
    </header>

    <main class="container mx-auto px-4">
        <h2 class="text-2xl font-semibold mb-4">Truyện mới cập nhật</h2>
        <div id="story-list" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-6">
            <!-- Danh sách truyện sẽ hiện ở đây -->
        </div>
    </main>

    <script>
        const stories = JSON.parse(localStorage.getItem('myStories')) || [];
        const list = document.getElementById('story-list');

        if (stories.length === 0) {
            list.innerHTML = '<p class="text-gray-500 col-span-full">Chưa có truyện nào. Hãy bấm "Quản trị / Đăng truyện" để viết truyện mới!</p>';
        } else {
            list.innerHTML = stories.map(s => `
                <div class="bg-white p-4 rounded shadow hover:shadow-lg transition">
                    <h3 class="font-bold text-lg mb-1"><a href="reader.html?id=${s.id}" class="hover:text-indigo-600">${s.title}</a></h3>
                    <p class="text-sm text-gray-500 mb-2">Tác giả: ${s.author}</p>
                    <p class="text-xs text-gray-600 line-clamp-2">${s.description}</p>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
