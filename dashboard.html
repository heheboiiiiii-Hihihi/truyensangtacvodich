<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Trang Quản Trị Admin - Truyện Sáng Tác Vô Địch</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800">
    <script>
        // Kiểm tra bảo mật: Phải đăng nhập và là admin mới được vào
        const currentUser = localStorage.getItem('currentUser');
        if (!currentUser) {
            alert('Bạn chưa đăng nhập!');
            window.location.href = 'login.html';
        }
        // Bạn có thể đặt tên tài khoản admin của mình ở đây (ví dụ: tài khoản "admin" hoặc tài khoản đầu tiên bạn đăng ký)
        // Nếu muốn cho phép mọi tài khoản tự quản lý truyện của mình, bạn có thể chỉnh lại phần lọc bên dưới.
    </script>

    <!-- Header Admin -->
    <header class="bg-indigo-900 text-white shadow p-4 sticky top-0 z-10">
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <span class="text-xl font-bold">⚙️ ADMIN DASHBOARD</span>
                <span class="bg-indigo-700 text-xs px-2 py-1 rounded">Hệ thống quản lý</span>
            </div>
            <div class="space-x-4 flex items-center">
                <span class="text-sm">Xin chào, <strong id="admin-name" class="text-yellow-300"></strong></span>
                <a href="index.html" class="bg-indigo-700 text-white px-3 py-1.5 rounded text-sm hover:bg-indigo-600">Trang chủ</a>
                <button onclick="logout()" class="bg-red-600 text-white px-3 py-1.5 rounded text-sm hover:bg-red-500">Đăng xuất</button>
            </div>
        </div>
    </header>

    <main class="container mx-auto px-4 py-8">
        <!-- Thống kê tổng quan -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-white p-6 rounded shadow border-l-4 border-indigo-600">
                <p class="text-gray-500 text-sm">Tổng số truyện trên web</p>
                <h3 id="total-stories" class="text-3xl font-bold text-indigo-600 mt-1">0</h3>
            </div>
            <div class="bg-white p-6 rounded shadow border-l-4 border-green-600">
                <p class="text-gray-500 text-sm">Tài khoản quản trị hiện tại</p>
                <h3 id="total-users" class="text-3xl font-bold text-green-600 mt-1">1</h3>
            </div>
            <div class="bg-white p-6 rounded shadow border-l-4 border-yellow-500">
                <p class="text-gray-500 text-sm">Trạng thái hệ thống</p>
                <h3 class="text-xl font-bold text-yellow-600 mt-2">🟢 Hoạt động tốt</h3>
            </div>
        </div>

        <!-- Quản lý danh sách truyện -->
        <div class="bg-white p-6 rounded shadow mb-8">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold text-gray-700">📚 Quản Lý Danh Sách Truyện</h2>
                <a href="admin.html" class="bg-indigo-600 text-white px-4 py-2 rounded text-sm hover:bg-indigo-700">+ Viết / Đăng truyện mới</a>
            </div>
            
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-100 border-b text-sm text-gray-600">
                            <th class="p-3">Ảnh bìa</th>
                            <th class="p-3">Tên truyện</th>
                            <th class="p-3">Tác giả</th>
                            <th class="p-3">Thể loại</th>
                            <th class="p-3">Người đăng</th>
                            <th class="p-3 text-center">Hành động</th>
                        </tr>
                    </thead>
                    <tbody id="admin-story-table">
                        <!-- Dữ liệu truyện sẽ load vào đây -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        document.getElementById('admin-name').innerText = currentUser;

        function logout() {
            localStorage.removeItem('currentUser');
            window.location.href = 'index.html';
        }

        // Tải dữ liệu hiển thị bảng quản lý
        function loadAdminData() {
            const stories = JSON.parse(localStorage.getItem('myStories')) || [];
            document.getElementById('total-stories').innerText = stories.length;

            const tableBody = document.getElementById('admin-story-table');

            if (stories.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="6" class="p-6 text-center text-gray-500">Chưa có truyện nào trong hệ thống.</td></tr>`;
                return;
            }

            tableBody.innerHTML = stories.map((s, index) => `
                <tr class="border-b hover:bg-gray-50 transition text-sm">
                    <td class="p-3">
                        <img src="${s.cover || 'https://via.placeholder.com/50'}" class="w-10 h-14 object-cover rounded shadow">
                    </td>
                    <td class="p-3 font-semibold text-indigo-600">
                        <a href="reader.html?id=${s.id}" target="_blank" class="hover:underline">${s.title}</a>
                    </td>
                    <td class="p-3">${s.author}</td>
                    <td class="p-3"><span class="bg-gray-200 text-gray-700 px-2 py-0.5 rounded text-xs">${s.genre || 'Tổng hợp'}</span></td>
                    <td class="p-3 text-gray-500">${s.uploader || 'Admin'}</td>
                    <td class="p-3 text-center space-x-2">
                        <a href="reader.html?id=${s.id}" target="_blank" class="bg-blue-500 text-white px-3 py-1 rounded text-xs hover:bg-blue-600">Xem</a>
                        <button onclick="deleteStory('${s.id}')" class="bg-red-500 text-white px-3 py-1 rounded text-xs hover:bg-red-600">Xóa</button>
                    </td>
                </tr>
            `).join('');
        }

        // Hàm xóa truyện
        function deleteStory(id) {
            if (confirm("Bạn có chắc chắn muốn xóa vĩnh viễn truyện này không?")) {
                let stories = JSON.parse(localStorage.getItem('myStories')) || [];
                stories = stories.filter(s => s.id !== id);
                localStorage.setItem('myStories', JSON.stringify(stories));
                alert('Đã xóa truyện thành công!');
                loadAdminData(); // Tải lại bảng
            }
        }

        loadAdminData();
    </script>
</body>
</html>
